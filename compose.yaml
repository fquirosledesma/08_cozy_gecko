services:
  ollama:
    image: ollama/ollama:latest
    container_name: cozy-gecko-ollama
    ports:
      - "11434:11434"
    volumes:
      - cozy_gecko_ollama:/root/.ollama
    restart: unless-stopped

  api:
    build: ./app
    container_name: cozy-gecko-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  cozy_gecko_ollama: